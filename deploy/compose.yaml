# ramzes with its built-in SQLite database. Run from the repository root:
#   docker compose -f deploy/compose.yaml up --build
# then open http://localhost:7269
services:
  ramzes:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "7269:7269"
    volumes:
      - ramzes-data:/data
    # ramzes finishes the deliveries in flight before it exits; Docker's default of 10 s is too short.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  ramzes-data:
