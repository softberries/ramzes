name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests on SQLite and Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ramzes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAMZES_TEST_POSTGRES_URL: postgres://postgres:ramzes@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --locked --no-tests=pass

  ui:
    name: Web app (lint, type check, unit tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # Component tests run in a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build

  # The real binary with the built UI, driven through a browser.
  e2e:
    name: Browser tests against the binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npx --prefix ui playwright install --with-deps chromium
      - run: cargo build --locked -p ramzes-server
      - run: npm --prefix ui run e2e
      - name: Keep what the browser saw when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: ui/test-results
          retention-days: 7

  deploy:
    name: Helm chart and compose files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.2
      - name: Helm lint
        run: helm lint --strict deploy/helm/ramzes
      - name: Helm template (SQLite and external Postgres)
        run: |
          helm template ramzes deploy/helm/ramzes >/dev/null
          helm template ramzes deploy/helm/ramzes \
            --set database.existingSecret=ramzes-db --set secretKey.existingSecret=ramzes-key >/dev/null
      - name: Compose config
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.postgres.yaml config --quiet

  site:
    name: Documentation site (build, links)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run linkcheck
