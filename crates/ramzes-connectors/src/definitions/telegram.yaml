kind: telegram
name: Telegram
description: Send to a Telegram chat, group or channel through a bot.
destination_label: Chat ID
fields:
  - key: bot_token
    label: Bot token
    help: "Create a bot with @BotFather; it gives you the token."
    secret: true
    required: true
  - key: chat_id
    label: Default chat ID
    help: "A numeric chat id, or @channelname. The bot must be a member. Used by routes that name no chat."
request:
  url: "https://api.telegram.org/bot{{ credentials.bot_token }}/sendMessage"
  body: |
    {% set chat = (destination | default(settings.chat_id)) | string | trim %}
    {% set text %}<b>{{ message.title | cut(250) | e }}</b>
    {% if message.body %}{{ message.body | cut(2400) | e }}
    {% endif %}{% for f in message.fields[:8] %}
    <i>{{ f.key | cut(40) | e }}</i>: {{ f.value | cut(100) | e }}{% endfor %}

    <code>{{ message.topic | cut(100) | e }}</code> · {{ message.status }} · {{ message.severity }}{% if message.link %}
    <a href="{{ message.link | e }}">Open in ramzes</a>{% endif %}{% if message.ack_link %}
    <a href="{{ message.ack_link | e }}">Acknowledge</a>{% endif %}{% endset %}
    {
      "chat_id": {% if chat is digits %}{{ chat }}{% else %}{{ chat | tojson }}{% endif %},
      "text": {{ text | tojson }},
      "parse_mode": "HTML",
      "link_preview_options": {"is_disabled": true}
    }
max_len: 2400
